name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p latent-cli
      - name: Package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          name=latent-$version-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md CHANGELOG.md "$name/"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/latent.exe" "$name/"
              7z a "$name.zip" "$name"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/latent" "$name/"
              tar czf "$name.tar.gz" "$name"
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --draft
          --generate-notes
