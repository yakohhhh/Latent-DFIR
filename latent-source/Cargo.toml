[package]
name = "latent-source"
description = "Evidence source access: image formats, partitions, read-only guarantees, hashing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
latent-core = { path = "../latent-core", version = "0.1.0" }
crc32fast = "1"
memmap2 = "0.9"
thiserror = "2.0"
tracing = "0.1"

# Read-only open plus F_GETFL verification. Windows uses OpenOptionsExt from std.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
